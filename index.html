<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAYAD</title>
<style>
:root{--y:#FFC107;--bg:#F7F7F5;--line:#E9E9E5;--red:#F04444;--green:#32B866}
*{box-sizing:border-box}body{margin:0;background:#e9e9e5;font-family:Arial,"Noto Sans",sans-serif;color:#111}
.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);position:relative}
header{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:900}.mark{width:34px;height:34px;background:var(--y);border-radius:10px;display:grid;place-items:center;font-size:22px}
.update{background:var(--y);border:0;border-radius:12px;padding:10px 13px;font-weight:900}
main{padding:20px 16px 90px}.hello{color:#666;font-size:14px}.name{font-size:25px;font-weight:900;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat,.card,.report{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}
.stat{min-height:88px}.stat small{color:#666;font-size:11px}.stat b{display:block;font-size:17px;margin-top:9px}
.warn{border-color:#ffd65a}.red{border-color:#ffb4b4}.redText{color:var(--red)}.greenText{color:var(--green)}
.title{font-size:14px;font-weight:900;margin:20px 3px 10px}.card{margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.company{display:flex;align-items:center;gap:10px}.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:#ef4444}.orange{background:#f59e0b}.green{background:#22c55e}.blue{background:#3b82f6}.purple{background:#8b5cf6}
.company span,.sub{display:block;color:#777;font-size:11px;margin-top:3px}.amount{font-weight:900;font-size:14px}
button{border:0;border-radius:13px;padding:12px 14px;font-weight:900;font-size:13px;cursor:pointer}.primary{background:var(--y)}.secondary{background:#f1f1ed}.full{width:100%}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
.nav{background:none;border-radius:0;color:#777;font-size:10px}.nav span{display:block;font-size:22px;margin-bottom:3px}.nav.active{color:#111}
.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;margin:12px 0;font-size:14px}
.back{background:none;padding:0 0 12px;color:#666}.center{text-align:center}.big{font-size:30px;font-weight:900;margin:8px 0}
.invoice{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.invoice:last-child{border:0}
.field{margin:12px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}.field textarea{min-height:80px}
.modal{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{max-width:430px;width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px}.actions{display:flex;gap:8px}.actions button{flex:1}
.hide{display:none!important}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;font-size:12px}
.splash{position:fixed;inset:0;background:var(--y);z-index:99;display:grid;place-items:center}.splash div{text-align:center}.splash .bigmark{width:82px;height:82px;background:#111;color:var(--y);border-radius:23px;display:grid;place-items:center;font-size:55px;font-weight:900;margin:auto}.splash h1{font-size:36px;margin:14px 0 3px}
.login{min-height:100vh;background:#fff;padding:70px 24px}.loginLogo{display:flex;justify-content:center;align-items:center;gap:10px;font-size:28px;font-weight:900;margin-bottom:45px}.loginLogo .mark{width:44px;height:44px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC107">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div id="splash" class="splash"><div><div class="bigmark">N</div><h1>NAYAD</h1><p>Smart Retail Platform</p></div></div>

<div id="login" class="login hide">
 <div class="loginLogo"><div class="mark">N</div>NAYAD</div>
 <h1>Тавтай морил 👋</h1><p style="color:#777">Дэлгүүрийнхээ тооцоог нэг дор удирд.</p>
 <div class="field"><label>Утасны дугаар</label><input id="phone" placeholder="9900 1234"></div>
 <div class="field"><label>Нууц үг</label><input id="pass" type="password" placeholder="••••••••"></div>
 <button class="primary full" onclick="enterApp()">НЭВТРЭХ</button>
</div>

<div id="app" class="app hide">
<header><div class="logo"><div class="mark">N</div>NAYAD</div><button id="update" class="update" onclick="updateNayad()">↻ UPDATE</button></header>
<main id="content"></main>
<div class="bottom">
 <button class="nav active" data-page="home"><span>⌂</span>Нүүр</button>
 <button class="nav" data-page="companies"><span>▦</span>Компани</button>
 <button class="nav" data-page="payments"><span>✓</span>Төлбөр</button>
 <button class="nav" data-page="reports"><span>◌</span>Тайлан</button>
</div></div>
<div id="modal" class="modal hide"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY="NAYAD_DATA_V2",LOGIN="NAYAD_LOGIN";
const SUPABASE_URL="https://kjgtmxcxchjevzoxwqzr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZ3RteGN4Y2hqZXZ6b3h3cXpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDUzMjMsImV4cCI6MjEwMjA4MTMyM30.pjRFSeGzu9KqEDheNHfL6bYcfPZyjfUdVPSsielEs48";

if (!window.supabase || typeof window.supabase.createClient !== "function") {
  throw new Error("Supabase library ачаалагдсангүй.");
}

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);
window.nayadSupabase = sb;
async function testSupabaseConnection(){
  try{
    const {data,error}=await sb.from("stores").select("id,name").limit(1);
    if(error){
      console.error("NAYAD Supabase:", {status:error.code||error.status, message:error.message});
      toast("Supabase холболтын алдаа: "+(error.message||"401 Unauthorized"));
      return {ok:false,error};
    }
    console.log("NAYAD Supabase OK:", data);
    toast("Supabase холболт амжилттай.");
    return {ok:true,data};
  }catch(e){
    console.error("NAYAD Supabase exception:", e);
    toast("Supabase холболтын алдаа.");
    return {ok:false,error:e};
  }
}
window.testSupabaseConnection=testSupabaseConnection;
const base={companies:[
{id:1,name:"Хонгороо",reg:"5023456",address:"Улаанбаатар",director:"Бат",directorPhone:"99112233",sales:"Дорж",salesPhone:"88112233",orgPhone:"70001234",color:"red",status:"active",invoices:[
{date:"2026-08-01",no:"INV-0801",amount:4250000,paid:0},{date:"2026-08-03",no:"INV-0803",amount:3280930,paid:1000000},{date:"2026-08-05",no:"INV-0805",amount:5400000,paid:0},{date:"2026-08-08",no:"INV-0808",amount:4400000,paid:0}]},
{id:2,name:"MCS ундаа",reg:"5034567",address:"Улаанбаатар",director:"Болд",directorPhone:"99001122",sales:"Сүх",salesPhone:"88001122",orgPhone:"70002345",color:"orange",status:"active",invoices:[
{date:"2026-08-02",no:"INV-0802",amount:6845960,paid:2000000},{date:"2026-08-06",no:"INV-0806",amount:7000000,paid:0}]},
{id:3,name:"Баярхүү / Намка найз",color:"green",status:"active",reg:"",address:"",director:"",directorPhone:"",sales:"",salesPhone:"",orgPhone:"",invoices:[{date:"2026-07-28",no:"INV-0728",amount:9000000,paid:0}]},
{id:4,name:"Шаргалжуут 5420101696",color:"blue",status:"active",reg:"",address:"",director:"",directorPhone:"",sales:"",salesPhone:"",orgPhone:"",invoices:[{date:"2026-07-30",no:"INV-0730",amount:7506500,paid:0}]},
{id:5,name:"Монос Групп",color:"purple",status:"active",reg:"",address:"",director:"",directorPhone:"",sales:"",salesPhone:"",orgPhone:"",invoices:[{date:"2026-08-04",no:"INV-0804",amount:2180000,paid:0}]},
{id:6,name:"Тотал Дистрибюшин",color:"green",status:"active",reg:"",address:"",director:"",directorPhone:"",sales:"",salesPhone:"",orgPhone:"",invoices:[{date:"2026-08-07",no:"INV-0807",amount:1250000,paid:0}]}],payments:[]};
const copy=o=>JSON.parse(JSON.stringify(o));
let data=load(),page="home",selected=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||copy(base)}catch(e){return copy(base)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return new Intl.NumberFormat("mn-MN").format(Math.round(n||0))+" ₮"}
function sync(){data.companies.forEach(c=>c.debt=c.invoices.reduce((s,i)=>s+i.amount-i.paid,0))}
function total(){sync();return data.companies.reduce((s,c)=>s+c.debt,0)}
function init(n){return (n||"N").replace(/[^A-Za-zА-Яа-яӨөҮү]/g,"").slice(0,1).toUpperCase()||"N"}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.remove("hide");setTimeout(()=>x.classList.add("hide"),2200)}
function render(){sync();save();document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=page==="home"?home():page==="companies"?companies():page==="payments"?payments():reports()}
function home(){let d=total(),top=data.companies.filter(c=>c.debt>0).slice(0,4);return `<div class="hello">Сайн байна уу,</div><div class="name">Namka 👋</div><div class="grid"><div class="stat warn"><small>Өртэй компани</small><b>${data.companies.filter(c=>c.debt>0).length}</b></div><div class="stat"><small>Нийт өр</small><b>${(d/1e6).toFixed(1)}<small> сая ₮</small></b></div><div class="stat red"><small>Өнөөдөр төлөх</small><b>${(d*.07/1e6).toFixed(1)}<small> сая ₮</small></b></div></div><div class="title">ЯАРАЛТАЙ ӨР</div>${top.map(c=>card(c,true)).join("")}<button class="primary full" onclick="addCompany()">＋ Компани нэмэх</button>`}
function card(c,pay=false){return `<div class="card" onclick="company(${c.id})"><div class="row"><div class="company"><div class="circle ${c.color}">${init(c.name)}</div><div><b>${c.name}</b><span>${c.invoices.length} падаан</span></div></div><div class="amount redText">${money(c.debt)}${pay?`<br><button class="primary" style="padding:6px 9px;margin-top:5px" onclick="event.stopPropagation();payment(${c.id})">Төлөх</button>`:""}</div></div></div>`}
function companies(){
sync();
let active=data.companies.filter(c=>c.status!=="inactive"), inactive=data.companies.filter(c=>c.status==="inactive");
return `<div class="row"><div><div class="hello">Нийлүүлэгчид</div><div class="name">Компаниуд</div></div><button class="primary" onclick="addCompany()">＋</button></div><input class="search" placeholder="⌕ Компани хайх..." oninput="filter(this.value)"><div class="title">ИДЭВХТЭЙ</div><div id="list">${active.map(c=>card(c)).join("")||`<div class="card sub">Идэвхтэй нийлүүлэгч алга.</div>`}</div><div class="title">ИДЭВХГҮЙ</div><div id="inactiveList">${inactive.map(c=>card(c)).join("")||`<div class="card sub">Идэвхгүй нийлүүлэгч алга.</div>`}</div>`}
function filter(q){let a=data.companies.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())),active=a.filter(c=>c.status!=="inactive"),inactive=a.filter(c=>c.status==="inactive");document.getElementById("list").innerHTML=active.map(c=>card(c)).join("")||`<div class="card">Илэрц олдсонгүй.</div>`;document.getElementById("inactiveList").innerHTML=inactive.map(c=>card(c)).join("")||`<div class="card sub">Илэрц олдсонгүй.</div>`}
function company(id){
selected=data.companies.find(c=>c.id===id);
if(!selected)return;
sync();
document.getElementById("content").innerHTML=`
<button class="back" onclick="page='companies';render()">← Буцах</button>

<div class="center">
<div class="circle ${selected.color}" style="margin:auto;width:48px;height:48px">${init(selected.name)}</div>
<h2 style="margin:8px 0 2px">${selected.name}</h2>
<div class="sub">${selected.status==="inactive"?"⚪ Идэвхгүй":"🟢 Идэвхтэй"}</div>
<div class="bigAmount">${money(selected.debt)}</div>
<div class="sub">Нийт өр</div>
</div>

<div class="sectionTitle">Компанийн мэдээлэл</div>

<div class="card">
<div class="invoice">
<div><small>Регистр</small><b>${selected.reg||"—"}</b></div>
</div>

<div class="invoice">
<div><small>Хаяг</small><b>${selected.address||"—"}</b></div>
</div>

<div class="invoice">
<div><small>Захирал</small><b>${selected.director||"—"}</b></div>
<div>${tel(selected.directorPhone)}</div>
</div>

<div class="invoice">
<div><small>Худалдааны төлөөлөгч</small><b>${selected.sales||"—"}</b></div>
<div>${tel(selected.salesPhone)}</div>
</div>

<div class="invoice">
<div><small>Байгууллагын утас</small></div>
<div>${tel(selected.orgPhone)}</div>
</div>
</div>

<div class="sectionTitle">Падаанууд</div>

<div class="card">
${selected.invoices.map(i=>`
<div class="invoice">
<div>
<small>${i.date} · ${i.no}</small>
<b>${money(i.amount)}</b>
</div>
<div class="${i.amount-i.paid>0?'redText':'greenText'}">
${i.amount-i.paid>0?money(i.amount-i.paid):"Төлөгдсөн"}
</div>
</div>
`).join("")}
</div>

<button class="primary full" onclick="invoice(${selected.id})">＋ Падаан нэмэх</button>

<button class="secondary full" onclick="payment(${selected.id})">
Төлбөр бүртгэх
</button>

<button type="button" class="secondary full" onclick="event.stopPropagation(); window.editCompany(Number(${selected.id}))">
✎ Мэдээлэл засах
</button>
`;
}
function tel(p){return p?`<a href="tel:${p}" style="text-decoration:none"><button class="secondary" style="padding:6px 8px">📞 ${p}</button></a>`:`<span class="sub">—</span>`}
function payments(){return `<div class="row"><div><div class="hello">Гүйлгээ</div><div class="name">Төлбөрүүд</div></div><button class="primary" onclick="payment()">＋</button></div><div style="height:14px"></div>${data.payments.length?data.payments.slice().reverse().map(p=>`<div class="card"><div class="row"><div><b>${p.company}</b><span>${p.date} · ${p.method}</span></div><b class="greenText">+ ${money(p.amount)}</b></div></div>`).join(""):`<div class="card center" style="padding:35px"><div style="font-size:35px">✓</div><b>Төлбөр одоогоор бүртгэгдээгүй</b></div>`}`}
function reports(){let d=total(),p=data.payments.reduce((s,x)=>s+x.amount,0),m=Math.max(...data.companies.map(c=>c.debt),1);return `<div class="hello">Тойм</div><div class="name">Тайлан</div><div style="height:15px"></div><div class="report"><div class="row"><span>Нийт өглөг</span><b>${money(d)}</b></div><div class="row" style="margin-top:12px"><span>Нийт төлсөн</span><b class="greenText">${money(p)}</b></div><div class="row" style="margin-top:12px"><span>Өртэй компани</span><b>${data.companies.filter(c=>c.debt>0).length}</b></div></div><div class="title">Компанийн өрийн бүтэц</div>${data.companies.slice().sort((a,b)=>b.debt-a.debt).map(c=>`<div class="report"><div class="row"><b>${c.name}</b><b>${money(c.debt)}</b></div><div style="height:9px;background:#eee;border-radius:9px;margin-top:9px"><div style="height:100%;width:${Math.max(2,c.debt/m*100)}%;background:var(--y);border-radius:9px"></div></div></div>`).join("")}`}
function sheet(s){document.getElementById("sheet").innerHTML=s;document.getElementById("modal").classList.remove("hide")}
function closeSheet(){document.getElementById("modal").classList.add("hide")}
window.closeSheet=closeSheet;
function addCompany(){sheet(`<h2>Нийлүүлэгч бүртгэх</h2>${field("newName","Компанийн нэр *","Жишээ: MCS ундаа")}${field("newReg","Регистр","5023456")}${field("newAddress","Хаяг","Улаанбаатар")}${field("newDirector","Захирал","Нэр")}${field("newDirectorPhone","Захирлын утас","99112233")}${field("newSales","Худалдааны төлөөлөгч","Нэр")}${field("newSalesPhone","ХТ-ийн утас","88112233")}${field("newOrgPhone","Байгууллагын утас","70001234")}<div class="actions"><button class="secondary" onclick="closeSheet()">Болих</button><button class="primary" onclick="saveCompany()">Хадгалах</button></div>`)}
function field(id,label,ph){return `<div class="field"><label>${label}</label><input id="${id}" placeholder="${ph||""}"></div>`}
function saveCompany(){let n=document.getElementById("newName").value.trim();if(!n)return toast("Компанийн нэр оруулна уу.");data.companies.push({id:Date.now(),name:n,reg:v("newReg"),address:v("newAddress"),director:v("newDirector"),directorPhone:v("newDirectorPhone"),sales:v("newSales"),salesPhone:v("newSalesPhone"),orgPhone:v("newOrgPhone"),status:"active",color:"green",invoices:[]});save();closeSheet();render();toast("Нийлүүлэгч бүртгэгдлээ.")}
function editCompany(id){selected=data.companies.find(c=>c.id===id);sheet(`<h2>Нийлүүлэгч засах</h2>${field("eName","Компанийн нэр",selected.name)}${field("eReg","Регистр",selected.reg)}${field("eAddress","Хаяг",selected.address)}${field("eDirector","Захирал",selected.director)}${field("eDirectorPhone","Захирлын утас",selected.directorPhone)}${field("eSales","Худалдааны төлөөлөгч",selected.sales)}${field("eSalesPhone","ХТ-ийн утас",selected.salesPhone)}${field("eOrgPhone","Байгууллагын утас",selected.orgPhone)}<div class="field"><label>Төлөв</label><select id="eStatus"><option value="active" ${selected.status!=="inactive"?"selected":""}>Идэвхтэй</option><option value="inactive" ${selected.status==="inactive"?"selected":""}>Идэвхгүй</option></select></div><div class="actions"><button class="secondary" onclick="closeSheet()">Болих</button><button class="primary" onclick="saveEdit()">Хадгалах</button></div>${selected.status==="inactive"?`<button class="secondary full" style="margin-top:10px;color:#c72c2c;background:#ffe2e2" onclick="deleteCompany(${selected.id})">Устгах</button>`:""}`)}
window.editCompany=editCompany;
function saveEdit(){selected.name=v("eName")||selected.name;selected.reg=v("eReg");selected.address=v("eAddress");selected.director=v("eDirector");selected.directorPhone=v("eDirectorPhone");selected.sales=v("eSales");selected.salesPhone=v("eSalesPhone");selected.orgPhone=v("eOrgPhone");selected.status=v("eStatus")||"active";save();closeSheet();page="companies";render();toast("Мэдээлэл шинэчлэгдлээ.")}
function deleteCompany(id){let c=data.companies.find(x=>x.id===id);if(!c)return;if(!confirm("Энэ нийлүүлэгчийг устгавал түүнтэй холбоотой падаан болон төлбөрийн түүх мөн устна. Устгах уу?"))return;data.companies=data.companies.filter(x=>x.id!==id);data.payments=data.payments.filter(x=>x.companyId!==id && x.company!==c.name);save();closeSheet();page="companies";render();toast("Нийлүүлэгч болон холбоотой төлбөрийн мэдээлэл устгагдлаа.")}
function invoice(id){selected=data.companies.find(c=>c.id===id);sheet(`<h2>Падаан нэмэх</h2><div class="card"><b>${selected.name}</b></div>${field("iDate","Огноо",new Date().toISOString().slice(0,10))}${field("iNo","Падааны дугаар","INV-0001")}${field("iAmount","Нийт дүн","0")}<div class="actions"><button class="secondary" onclick="closeSheet()">Болих</button><button class="primary" onclick="saveInvoice()">Падаан нэмэх</button></div>`);document.getElementById("iDate").type="date"}
function saveInvoice(){let a=Number(v("iAmount"));if(!a)return toast("Дүн оруулна уу.");selected.invoices.push({date:v("iDate"),no:v("iNo")||"INV-"+Date.now().toString().slice(-4),amount:a,paid:0});save();closeSheet();company(selected.id);toast("Падаан нэмэгдлээ.")}
function payment(id){let opts=data.companies.map(c=>`<option value="${c.id}" ${id===c.id?"selected":""}>${c.name} — ${money(c.debt)}</option>`).join("");sheet(`<h2>Төлбөр нэмэх</h2><div class="field"><label>Нийлүүлэгч</label><select id="pCompany">${opts}</select></div>${field("pAmount","Төлсөн дүн","0")}<div class="field"><label>Төлбөрийн арга</label><select id="pMethod"><option>Банк</option><option>Бэлэн мөнгө</option><option>QPay</option><option>Карт</option><option>Бусад</option></select></div>${field("pDate","Огноо",new Date().toISOString().slice(0,10))}<div class="actions"><button class="secondary" onclick="closeSheet()">Болих</button><button class="primary" onclick="savePayment()">Төлөх</button></div>`);document.getElementById("pDate").type="date"}
function savePayment(){let c=data.companies.find(x=>x.id===Number(v("pCompany"))),a=Number(v("pAmount"));if(!a)return toast("Төлөх дүн оруулна уу.");sync();if(a>c.debt)return toast("Үлдэгдлээс их байна.");let r=a;c.invoices.sort((x,y)=>x.date.localeCompare(y.date));for(let i of c.invoices){let b=i.amount-i.paid;if(b<=0)continue;let x=Math.min(b,r);i.paid+=x;r-=x;if(!r)break}data.payments.push({company:c.name,amount:a,date:v("pDate"),method:v("pMethod")});save();closeSheet();render();toast("Төлбөр амжилттай бүртгэгдлээ.")}
function v(id){return document.getElementById(id)?.value||""}
function enterApp(){localStorage.setItem(LOGIN,"1");document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");render()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
async function updateNayad(){let b=document.getElementById("update");b.disabled=true;b.textContent="Шинэчилж байна...";localStorage.setItem(LOGIN,"1");try{if("serviceWorker"in navigator){for(let r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if("caches"in window){for(let k of await caches.keys())await caches.delete(k)}location.replace(location.pathname+"?update="+Date.now())}catch(e){b.disabled=false;b.textContent="↻ UPDATE";location.reload(true)}}
window.addEventListener("load",()=>setTimeout(()=>{document.getElementById("splash").classList.add("hide");if(localStorage.getItem(LOGIN)==="1"){document.getElementById("app").classList.remove("hide");render()}else document.getElementById("login").classList.remove("hide")},700));
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.log));
</script>
</body></html>

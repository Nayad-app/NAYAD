name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Test private photo storage permissions in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/nayad-photo-check" --no-package-lock @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/nayad-photo-check/node_modules" node scripts/test-identity-photo-rls.cjs

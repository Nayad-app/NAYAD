name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: npm ci --prefix tests/push-validation --ignore-scripts
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/push-database.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/push-settings.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/loan-contract-database.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/loan-contract-editor.cjs

      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/loan-payment.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/payment-fifo.cjs

      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/loan-actions.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/section-router.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/contact-refresh.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/staff-review-database.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/staff-review-ui.cjs

      - run: PGLITE_MODULE="$PWD/tests/push-validation/node_modules/@electric-sql/pglite/dist/index.js" node tests/statement-activity.sql-test.mjs

      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/staff-permissions-database.cjs

      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/staff-self-service-database.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/staff-self-service-ui.cjs

      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/payment-selection.cjs
      - run: NODE_PATH="$PWD/tests/push-validation/node_modules" node tests/payment-selection-database.cjs
